name: Validate Documentation

on:
  push:
    branches:
      - main
      - 'chore/**'
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate required document fields
        shell: pwsh
        run: ./scripts/validate-docs.ps1

      - name: Validate unique document IDs
        shell: pwsh
        run: ./scripts/check-document-ids.ps1
